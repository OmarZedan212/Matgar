[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "learning-website-api"
version = "0.1.0"
description = "FastAPI backend for Learning Website"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.2,<2",
  "fastapi[standard]>=0.115.0,<1",
  "pydantic-settings>=2.5.2,<3",
  "psycopg[binary]>=3.2.1,<4",
  "pyjwt>=2.9.0,<3",
  "redis>=5.0.8,<6",
  "sqlalchemy>=2.0.34,<3",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.2,<1",
  "pytest>=8.3.2,<9",
  "pytest-cov>=5.0.0,<6",
  "ruff>=0.6.3,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
